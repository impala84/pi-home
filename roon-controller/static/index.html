<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#080b0a"><title>Roon · Pi Home</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=1000"><link rel="stylesheet" href="refinements.css?v=1134"></head>
<body><a class="settings settings-cog" id="settings-link" href="/admin" aria-label="Settings"><span data-pi-icon="settings"></span></a>
<time id="dashboard-clock" aria-label="Current time">--:--</time><nav id="music-nav" class="music-subnav" aria-label="Roon and amplifier view"><button id="now-tab" class="active">NOW PLAYING</button><button id="queue-tab">QUEUE</button><button id="browse-tab">BROWSE</button></nav>
<main id="now-view">
  <button class="art" id="details-open" aria-label="Show album and artist details"><img id="art" alt="Album artwork"><span id="placeholder">ROON</span></button>
  <section class="details"><p id="zone" class="eyebrow">ROON NOW PLAYING</p><h1 id="title">Waiting for Roon</h1><p id="artist">Enable Pi Home Roon Controller in Roon → Settings → Extensions</p>
    <div class="timeline"><input id="seek" type="range" min="0" max="1" value="0" aria-label="Track position"><div><span id="elapsed">0:00</span><span id="remaining">−0:00</span></div></div>
    <div class="transport"><button id="library-add" class="library-action" aria-label="Add album to library" title="Add to Library" hidden><span data-pi-icon="heart"></span></button><button id="previous" aria-label="Previous track" disabled><span data-pi-icon="previous"></span></button><button id="play" class="play" aria-label="Play or pause" disabled><span data-pi-icon="pause"></span></button><button id="next" aria-label="Next track" disabled><span data-pi-icon="next"></span></button></div>
    <div id="volume-panel" class="volume" hidden><button id="mute">MUTE</button><input id="volume" type="range" min="0" max="100" value="0" aria-label="Volume"><output id="volume-value">—</output></div>
    <p id="fixed" class="fixed" hidden>FIXED VOLUME</p>
  </section>
</main><section id="queue-view" class="queue-view" hidden><div id="queue-list" class="queue-list"></div></section>
<section id="browser-view" class="browser-view" hidden><aside class="browser-sidebar" aria-label="Library sections"><button type="button" data-browser-section="albums">ALBUMS</button><button type="button" data-browser-section="artists">ARTISTS</button><button type="button" data-browser-section="genres">GENRES</button><button type="button" data-browser-section="playlists">PLAYLISTS</button><button id="browser-search-open" type="button">SEARCH</button><button id="browser-surprise" type="button" hidden>SURPRISE!</button></aside><aside id="browser-artist" class="artist-profile" hidden></aside><div id="browser-scroll" class="browser-shell"><p id="browser-message" class="browser-message" hidden></p><div id="browser-list" class="browser-list"></div><div id="browser-loading-more" class="browser-loading-more" hidden>LOADING MORE…</div></div><div id="browser-scrubber" class="browser-scrubber" hidden><output id="browser-scrub-letter">A</output><span class="browser-scrub-dot" aria-hidden="true"></span><input id="browser-scrub-range" type="range" min="0" max="25" step="1" value="0" aria-label="Jump through the alphabet"></div><button id="browser-back" class="browser-back" type="button" hidden>BACK</button><div id="browser-search-panel" class="browser-search-panel" hidden><form id="browser-search-form"><input id="browser-search-input" type="search" placeholder="Search Roon" aria-label="Search Roon" autocomplete="off"><button type="submit">SEARCH</button><button id="browser-search-cancel" type="button">CANCEL</button></form><div id="browser-keyboard" class="browser-keyboard" aria-label="Search keyboard"></div></div></section>
<section id="source-view" class="source-view" hidden><p id="source-zone" class="eyebrow">Player</p><h1 id="source-title">External input</h1><p id="source-subtitle"></p><div id="amp-volume-panel" class="source-volume"><button id="amp-down" aria-label="Volume down"><span data-pi-icon="remove"></span></button><output id="amp-volume-value">—</output><button id="amp-up" aria-label="Volume up"><span data-pi-icon="add"></span></button></div><button id="amp-mute" class="source-mute">MUTE</button></section>
<section id="details-view" class="details-view" hidden><div class="details-panel"><section class="details-entity details-artist-card"><button id="details-artist-artwork-close" class="details-art" aria-label="Return to Now Playing"><img id="details-artist-art" alt="Artist portrait"><span id="details-artist-placeholder">ARTIST</span></button><div class="details-copy"><div class="details-metadata"><p class="eyebrow">ARTIST</p><h2 id="details-artist-heading">Unknown artist</h2><p id="details-artist-writeup" class="details-writeup"></p><p id="details-artist-source" class="details-source"></p></div></div></section><section class="details-entity details-album-card"><button id="details-artwork-close" class="details-art" aria-label="Return to Now Playing"><img id="details-art" alt="Album artwork"><span id="details-placeholder">ALBUM</span></button><div class="details-copy"><div class="details-metadata"><p class="eyebrow">ALBUM</p><h2 id="details-title">Nothing playing</h2><p id="details-artist"></p><p id="details-subtitle"></p><p id="details-writeup" class="details-writeup"></p><p id="details-source" class="details-source"></p><dl id="details-facts" class="details-facts"></dl><ol id="details-tracks" class="details-tracks"></ol></div></div></section></div></section>
<nav class="web-nav" aria-label="Dashboard"><a id="roon-link" class="active" href="./">Now Playing</a><a id="bus-link" href="/">Bus Times</a><a id="home-link" href="/home.html">Home</a></nav><script src="icons.js?v=1114"></script><script src="discovery.js?v=1114"></script><script src="app.js?v=1134"></script><script>document.querySelectorAll("[data-pi-icon]").forEach(node => node.replaceWith(PiHomeIcons.element(node.dataset.piIcon)));</script></body></html>
