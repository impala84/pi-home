<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b1110">
  <title>RoonDeck</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css?v=1101">
  <link rel="stylesheet" href="/bus-refinements.css?v=1114">
</head>
<body>
  <main id="app">
    <a class="settings-link settings-cog" href="/admin" aria-label="Settings"><span data-pi-icon="settings"></span></a>
    <header><div><p class="eyebrow">ROONDECK</p><h1 id="stop">Connecting…</h1></div><div class="header-tools"><time id="clock">--:--</time></div></header>
    <div class="bus-results"><section id="services" class="services" aria-live="polite"></section>
    <footer><span id="status">Starting</span><span id="updated"></span></footer></div>
    <nav class="web-nav" aria-label="Dashboard"><a id="roon-link" href="/roon/">Roon</a><a class="active" href="/">Bus Times</a><a href="/home.html">Home</a></nav>
  </main>
  <section id="resting" class="resting" hidden><p class="eyebrow">ROON</p><time id="rest-clock">--:--</time><p>Add the Roon Display URL in settings</p></section>
  <script src="/app.js?v=1102"></script>
<script src="/icons.js?v=1114"></script><script>document.querySelectorAll("[data-pi-icon]").forEach(node => node.replaceWith(PiHomeIcons.element(node.dataset.piIcon)));</script></body>
</html>
