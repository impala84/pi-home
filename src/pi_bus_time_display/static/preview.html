<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoonDeck · Screen Preview</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/admin.css?v=1009"><link rel="stylesheet" href="/preview.css?v=19"></head>
<body><main><header><a href="/admin.html">← Settings</a><h1>Screen Preview</h1><p>These controls change the physical Pi display. Playback requires a separate action.</p></header>
<nav id="sections" aria-label="Display section"><button data-section="now" aria-pressed="true">Now Playing</button><button data-section="discover" aria-pressed="false">Discover</button><button data-section="bus" aria-pressed="false">Bus Times</button><button data-section="home" aria-pressed="false">Home</button><button data-section="settings" aria-pressed="false">Settings</button></nav>
<label id="now-options">Now Playing view<select id="now-view"><option value="now">Player</option><option value="details">Album &amp; Artist</option></select></label>
<label id="discover-options" hidden>Discover view<select id="discover-view"><option value="recent">Recent</option><option value="browse">Browse</option><option value="daily">Daily</option><option value="releases">New Releases</option><option value="surprise">Surprise Me</option></select></label>
<nav id="browse-sections" aria-label="Browse category" hidden><button data-browse="albums">Albums</button><button data-browse="artists">Artists</button><button data-browse="genres">Genres</button><button data-browse="playlists">Playlists</button><button data-browse="search">Search</button></nav>
<p id="status" role="status" aria-live="polite">Ready. Choose a section or refresh the current screen.</p>
<div class="action-buttons"><button id="back" hidden>← Back</button><button id="refresh">Refresh preview</button><a id="download" class="capture-download" hidden download="roondeck-display.png">Download screenshot</a></div>
<p id="timestamp"></p><img id="screen" alt="Last captured physical Pi display" hidden>
<section id="browse-results" hidden><h2 id="browse-title">Browse</h2><label>Find in this list<input id="filter" type="search" placeholder="Album, artist or track"></label><div id="items"></div><h3 id="actions-title" hidden>Playback actions</h3><div id="actions"></div></section>
</main><script src="/preview.js?v=19"></script></body></html>
