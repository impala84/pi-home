name: Baseline checks
on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: roon-controller/package-lock.json
      - run: python -m pip install .
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: npm --prefix roon-controller ci --omit=dev --no-audit --no-fund
      - run: npm --prefix roon-controller test
      - run: bash -n scripts/install-pi.sh scripts/install-roon-bridge.sh scripts/pi-bus-update scripts/pi-bus-appliance-mode scripts/pi-bus-cage-launch
      - run: python -m py_compile native-display/pi_bus_native.py scripts/pi-bus-system-action
