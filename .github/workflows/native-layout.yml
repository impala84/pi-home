name: Native layout checks
on:
  push:
    branches: [alpine-beta, discover-v1.1, main]
  workflow_dispatch:
jobs:
  layout:
    if: github.ref == 'refs/heads/alpine-beta'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Render native Alpine layouts without rebuilding the appliance
        run: |
          mkdir -p dist/native-review
          docker run --rm -v "$PWD:/opt/pi-home:ro" -v "$PWD/dist/native-review:/screenshots" -w /opt/pi-home alpine:3.24.2 sh -ec '
            apk add --no-cache python3 py3-gobject3 py3-cairo gtk4.0 font-inter dbus adwaita-icon-theme librsvg xvfb-run imagemagick
            for dimensions in 720x1280 480x800 1200x1920 1280x720; do
              width=${dimensions%x*}; height=${dimensions#*x}
              GDK_BACKEND=x11 GSK_RENDERER=cairo PI_HOME_SCREEN_WIDTH=$width PI_HOME_SCREEN_HEIGHT=$height PI_HOME_SCREENSHOT_DIR=/screenshots/$dimensions dbus-run-session xvfb-run -a -s "-screen 0 ${dimensions}x24" python3 appliance/alpine/discover_visual_review.py
            done'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-layout-review
          path: dist/native-review/
          retention-days: 14
  rpi-layout:
    if: github.ref != 'refs/heads/alpine-beta'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian GTK display-test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-graphene-1.0 fonts-inter dbus-x11 adwaita-icon-theme librsvg2-common xvfb imagemagick
      - name: Render shared layouts with Debian GTK
        run: |
          sudo ln -s "$PWD" /opt/pi-home
          mkdir -p dist/native-review
          for dimensions in 800x480 480x800 720x1280 1200x1920 1280x720; do
            width=${dimensions%x*}; height=${dimensions#*x}
            GDK_BACKEND=x11 GSK_RENDERER=cairo PI_HOME_SCREEN_WIDTH=$width PI_HOME_SCREEN_HEIGHT=$height PI_HOME_SCREENSHOT_DIR=$PWD/dist/native-review/$dimensions dbus-run-session xvfb-run -a -s "-screen 0 ${dimensions}x24" /usr/bin/python3 appliance/alpine/discover_visual_review.py
          done
          GDK_BACKEND=x11 GSK_RENDERER=cairo dbus-run-session xvfb-run -a /usr/bin/python3 appliance/alpine/settings_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpi-native-layout-review
          path: dist/native-review/
          retention-days: 14
