name: Alpine appliance prototype
on:
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Image factory tools
        run: sudo apt-get update && sudo apt-get install -y dosfstools e2fsprogs fdisk mtools
      - name: Build ARM64 appliance image
        run: bash appliance/alpine/build-image.sh
      - name: Validate Alpine runtime without pretending to boot the Pi
        run: |
          docker run --rm pi-home-alpine:prototype .venv/bin/python -c 'import gi; gi.require_version("Gtk", "4.0"); gi.require_version("Graphene", "1.0"); gi.require_foreign("cairo"); from gi.repository import Gtk, Graphene; import pi_bus_time_display'
          docker run --rm -w /opt/pi-bus-time-display/roon-controller pi-home-alpine:prototype node -e 'require("node-roon-api"); require("./discovery-model")'
      - uses: actions/upload-artifact@v4
        with:
          name: pi-home-alpine-prototype
          path: dist/alpine/
          retention-days: 14
