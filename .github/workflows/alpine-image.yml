name: Alpine appliance prototype
on:
  push:
    branches: [alpine-appliance-prototype]
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Image factory tools
        run: sudo apt-get update && sudo apt-get install -y dosfstools e2fsprogs fdisk mtools
      - name: Build ARM64 appliance image
        run: bash appliance/alpine/build-image.sh
      - name: Validate Alpine runtime without pretending to boot the Pi
        run: |
          docker run --rm --user morningbus pi-home-alpine:prototype .venv/bin/python appliance/alpine/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: pi-home-alpine-prototype
          path: dist/alpine/
          retention-days: 14
